<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Panorama nacional · Presidente 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#0b1220; --card:#161e2e; --card2:#1c2638; --line:#26324a; --fg:#f1f5f9; --muted:#94a3b8;
  --orange:#f97316; --orange2:#ff5f00; --amber:#f59e0b; --yellow:#facc15;
  --a:#f97316; --b:#38bdf8; --sem:#2a3346;
  --f:"Archivo",system-ui,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.35 var(--f);
  padding:max(12px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:800px;margin:0 auto;display:grid;gap:12px}
.num{font-variant-numeric:tabular-nums}
.hdr{background:linear-gradient(120deg,var(--amber),var(--orange) 55%,var(--orange2));border-radius:18px;padding:16px;display:grid;gap:12px;color:#fff}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.hdr h1{margin:0;font:900 24px/1 var(--f)}
.hdr .sub{font-size:13px;opacity:.9;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border-radius:99px;padding:5px 10px;font:700 13px var(--f);white-space:nowrap}
.chip .y{color:var(--yellow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.dot.live{background:#4ade80;animation:pulse 1.6s infinite}
.dot.err{background:#ef4444}
@keyframes pulse{50%{opacity:.3}}
.big{font:900 15px var(--f);background:#fff;color:var(--orange2);border-radius:99px;padding:5px 12px}
.prog{height:6px;border-radius:3px;background:rgba(0,0,0,.25);overflow:hidden}
.prog i{display:block;height:100%;background:#fff;width:0;transition:width .8s}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{background:rgba(80,30,0,.35);color:#fff;text-decoration:none;font:700 13px var(--f);padding:7px 12px;border-radius:99px}
.tabs a[aria-current]{background:#fff;color:var(--orange2)}

.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.vs .c{display:grid;gap:2px;min-width:0}
.vs .c:last-child{text-align:right}
.vs .nm{font:900 15px var(--f);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .pc{font:900 30px/1 var(--f)}
.vs .sg{font:700 12px var(--f);color:var(--muted)}
.vs .x{font:900 14px var(--f);color:var(--muted)}
.A{color:var(--a)} .B{color:var(--b)}
.turno{font:800 13px var(--f);padding:10px 12px;border-radius:12px;background:var(--card2);color:var(--muted)}
.turno.t2{background:rgba(250,204,21,.14);color:var(--yellow)}
.turno.ok{background:rgba(74,222,128,.14);color:#4ade80}

.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sh h2{margin:0;font:900 17px var(--f);text-transform:uppercase}
.sh .ap{color:var(--orange);font:700 13px var(--f)}
.map{width:100%;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map path{stroke:var(--bg);stroke-width:1.2;cursor:pointer;transition:fill .6s}
.map path.sel{stroke:#fff;stroke-width:2.5}
.map text{pointer-events:none;font-family:var(--f);paint-order:stroke;stroke:rgba(11,18,32,.85);stroke-width:3px;stroke-linejoin:round}
.map .uf{font-weight:900;font-size:13px;fill:#fff}
.map .pp{font-weight:900;font-size:14px}
.map .ap{font-weight:700;font-size:11px;fill:#e2e8f0}
.map line{stroke:var(--muted);stroke-width:1}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font:700 12px var(--f);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.det{background:var(--card2);border-radius:12px;padding:12px;display:grid;gap:8px}
.det h3{margin:0;font:900 16px var(--f);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.det h3 span{color:var(--orange);font-size:13px}
.bar2{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sem)}
.bar2 .ba{background:var(--a)} .bar2 .bb{background:var(--b)}

.tools{display:flex;gap:6px;flex-wrap:wrap}
.tools select{flex:1 1 160px;min-width:0;font:600 14px var(--f);padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--fg)}
.list{display:grid;gap:6px}
.st{display:grid;grid-template-columns:44px 1fr auto;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--card2);border:1px solid transparent}
.st.sel{border-color:var(--orange)}
.st .u{font:900 15px var(--f)}
.st .u small{display:block;font:700 10px var(--f);color:var(--muted)}
.st .r{font:900 15px var(--f);text-align:right;white-space:nowrap}
.st .r small{display:block;font:700 11px var(--f);color:var(--orange)}
.st .bar2{height:8px}
.msg{color:var(--muted);font-size:13px}
.log{font:600 11px var(--f);color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center;display:grid;gap:4px}
.foot a{color:var(--orange)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div class="hrow">
      <div><h1>PANORAMA NACIONAL</h1><div class="sub">Presidente · 1º turno · resultado oficial do TSE</div></div>
      <div class="chip"><span class="y" id="cd">atualizando…</span><span class="dot" id="dot"></span>TSE <b id="hg">--:--</b></div>
    </div>
    <div class="hrow" style="align-items:center;justify-content:flex-start"><span class="big num" id="apBR">0,00% apurado no Brasil</span><span class="chip num" id="totBR" hidden></span></div>
    <div class="prog"><i id="progBR"></i></div>
    <nav class="tabs"><a href="./">📋 Ceará</a><a href="./panorama.html" aria-current="page">🇧🇷 Panorama nacional</a><a href="./previsao.html">📈 Previsão</a></nav>
  </header>

  <div class="vs" id="vs"><div class="c"><div class="msg">Carregando…</div></div></div>
  <div class="turno" id="turno" hidden></div>

  <section class="sec">
    <div class="sh"><h2>Mapa por estado</h2><span class="ap num" id="cnt"></span></div>
    <div class="log num" id="logBR"></div>
    <div class="legend" id="leg"></div>
    <div class="map" id="map"></div>
    <div class="det" id="det" hidden></div>
  </section>

  <section class="sec">
    <div class="sh"><h2>Estados</h2></div>
    <div class="tools"><select id="ord" aria-label="Ordenar estados">
      <option value="a">Mais apurado</option><option value="ma">Maior vantagem do 1º</option><option value="mb">Maior vantagem do 2º</option><option value="n">Nome (A–Z)</option><option value="el">Mais eleitores</option></select></div>
    <div class="list" id="lst"></div>
  </section>

  <div class="foot"><span id="pausa" hidden></span><span id="err"></span>
    <span>Dados: <a href="https://resultados.tse.jus.br" target="_blank" rel="noopener">resultados.tse.jus.br</a> · Mapa: <a href="https://github.com/VictorCazanave/svg-maps" target="_blank" rel="noopener">svg-maps</a> (CC BY 4.0)</span></div>
</div>

function bomba(){
  clearTimeout(Q.timer);
  const agora=Date.now();
  if(agora<Q.ate){Q.timer=setTimeout(bomba,Q.ate-agora);avisoPausa();return}
  while(Q.ativos<Q.MAX&&Q.fila.length){
    const it=Q.fila.shift();
    if(Q.frio[it.u]>Date.now()){it.rej(new Error("HTTP 404"));continue}
    Q.ativos++;NREQ++;
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
    fetch(it.u,{cache:"no-cache",signal:ctl.signal}).then(async r=>{

        Q.pausa=Math.min(600,Math.max(90,ra,Q.pausa*2||90));

      }

      if(r.status===404)Q.frio[it.u]=Date.now()+300000;
      if(!r.ok)return it.rej(new Error("HTTP "+r.status));

function situacao(d){
  if(!d||!d.vv)return null;
  const l=d.cand.slice().sort((a,b)=>b.vap-a.vap),up=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
  const of=l.find(c=>c.e==="s"||up(c.sit).startsWith("ELEITO"));
  if(of)return{t:"ok",txt:`✓ ${of.nm} eleito no 1º turno (declarado pelo TSE)`};
  if(l.some(c=>up(c.sit).includes("TURNO")))return{t:"t2",txt:"🔁 Haverá 2º turno em 25/10 (declarado pelo TSE)"};
  const R0=d.pst>=100?0:Math.max(d.esnt,d.el&&d.est?d.el-d.est:0);
  if(d.pst<100&&!R0)return null;
  const R=R0+d.sj,vv=d.vv;
  if(l[0]&&2*l[0].vap>vv+R)return{t:"ok",txt:`✓ ${l[0].nm} eleito no 1º turno (garantido matematicamente)`};
  if(l.every(x=>2*(x.vap+R)<=vv+R)){
    const fin=l.filter(x=>{const d2=l.filter(o=>o!==x).map(o=>Math.max(0,x.vap-o.vap)).sort((a,b)=>a-b);return d2.length<2||d2[0]+d2[1]>R});

    $("vs").innerHTML=`<div class="c"><div class="nm A">${esc(A.nm)}</div><div class="pc num A">${br(A.pvap,2)}%</div><div class="sg">1º · ${esc(A.sg)} · ${br(A.vap)} votos</div></div>
      <div class="x">VS</div>
      <div class="c"><div class="nm B">${esc(B.nm)}</div><div class="pc num B">${br(B.pvap,2)}%</div><div class="sg">2º · ${esc(B.sg)} · ${br(B.vap)} votos</div></div>`;
    $("leg").innerHTML=`<span><i style="background:var(--a)"></i>${esc(A.nm)} na frente</span><span><i style="background:var(--b)"></i>${esc(B.nm)} na frente</span><span><i style="background:var(--sem)"></i>sem apuração</span><span>cor mais forte = vantagem maior · toque num estado</span>`;
  }
  const si=situacao(D.br);$("turno").hidden=!si;if(si){$("turno").className="turno "+si.t;$("turno").textContent=si.txt}
  let com=0;
  for(const g of GEO.s){
    const p=par(g.id);
    $("p-"+g.id).style.fill=corDe(p);
    $("p-"+g.id).classList.toggle("sel",sel===g.id);
    if(p){com++;$("t-"+g.id).innerHTML=`<tspan class="A" style="fill:var(--a)">${Math.round(p.a)}</tspan><tspan fill="#cbd5e1">×</tspan><tspan style="fill:var(--b)">${Math.round(p.b)}</tspan>`;$("a-"+g.id).textContent=`${br(p.ap,0)}% apur.`}
    else{const ab=AB[g.id];$("t-"+g.id).textContent="";$("a-"+g.id).textContent=ab?`${br(ab.p,0)}% apur.`:""}
  }
  $("cnt").textContent=`${com} de 27 estados carregados`;
  const hora=t=>t?new Date(t).toLocaleTimeString("pt-BR"):"—";
  $("logBR").textContent=D.br?`Brasil: TSE ${String(D.br.hg||"").slice(0,8)} · baixado ${hora(D.t?.br)} · conferido ${hora(t0||null)}`:"";
  detalhe(A,B);lista(A,B);
}
function barra(p){return`<div class="bar2"><i class="ba" style="width:${p.a}%"></i><i class="bb" style="width:${p.b}%"></i></div>`}
function detalhe(A,B){
  const el=$("det");if(!sel||!A){el.hidden=true;return}
  const p=par(sel),d=D.uf[sel];el.hidden=false;
  if(!p){el.innerHTML=`<h3>${UFN[sel]}<span>${AB[sel]?br(AB[sel].p,2)+"% apurado":""}</span></h3><div class="msg">Aguardando dados deste estado…</div>`;return}
  const outros=d.cand.slice().sort((a,b)=>b.vap-a.vap).slice(0,4).map(c=>`<span>${esc(c.nm)} <b class="num">${br(c.pvap,2)}%</b></span>`).join(" · ");
  el.innerHTML=`<h3>${UFN[sel]}<span class="num">${br(p.ap,2)}% apurado</span></h3>
    <div class="log num">TSE ${esc(String(p.hg||"").slice(0,8))} · baixado ${D.t?.[sel]?new Date(D.t[sel]).toLocaleTimeString("pt-BR"):"—"}</div>
    <div class="num"><b class="A">${esc(A.nm)} ${br(p.a,2)}%</b> × <b class="B">${br(p.b,2)}% ${esc(B.nm)}</b></div>${barra(p)}
    <div class="msg">Mais votados no estado: ${outros}</div>`;
}
function lista(A,B){
  if(!A){$("lst").innerHTML='<div class="msg">Carregando…</div>';return}
  const ord=$("ord").value;
  let rows=Object.keys(UFN).map(u=>({u,p:par(u)})).filter(r=>r.p);
  const f={a:(x,y)=>y.p.ap-x.p.ap,ma:(x,y)=>(y.p.a-y.p.b)-(x.p.a-x.p.b),mb:(x,y)=>(y.p.b-y.p.a)-(x.p.b-x.p.a),n:(x,y)=>UFN[x.u].localeCompare(UFN[y.u],"pt-BR"),el:(x,y)=>y.p.el-x.p.el}[ord];
  rows.sort(f);
  $("lst").innerHTML=rows.map(({u,p})=>`<div class="st${sel===u?" sel":""}" data-uf="${u}">
    <div class="u">${u.toUpperCase()}<small>${esc(UFN[u])}</small></div>${barra(p)}
    <div class="r num"><span class="A">${br(p.a,1)}</span> × <span class="B">${br(p.b,1)}</span><small>${br(p.ap,2)}% apurado</small></div></div>`).join("")||'<div class="msg">Carregando estados…</div>';
}
$("ord").addEventListener("change",desenha);
$("lst").addEventListener("click",ev=>{const u=ev.target.closest("[data-uf]")?.dataset.uf;if(u&&u!=="zz"){sel=u;desenha();$("map").scrollIntoView({block:"start",behavior:"smooth"})}});

// ===== Ciclo: 1 arquivo de andamento; estado só é baixado quando muda =====
async function ciclo(){
  nTick++;const errs=[];
  try{
    const j=await tse(abUrl,true);AB={};
    for(const a of j.abr||[]){const k=String(a.cdabr||"").toLowerCase();AB[k]={st:num(a.s?.st),p:num(a.s?.pst)}}
  }catch(e){errs.push("andamento: "+e.message)}
  const semAb=!Object.keys(AB).length;
  // Baixa se: nunca baixou, andamento mudou, ou o dado salvo passou do limite (Brasil 90 s, estados 3 min)
  D.t=D.t||{};
  const precisa=k=>{const st=AB[k]?.st,lim=k==="br"?90000:180000;
    return !(k==="br"?D.br:D.uf[k])||(st!=null&&st!==D.seen[k])||Date.now()-(D.t[k]||0)>lim};
  const jobs=[];
  if(precisa("br"))jobs.push(tse(url("br"),true).then(j=>{D.br=achata(j);D.seen.br=AB.br?.st??-1;D.t.br=Date.now()}).catch(e=>errs.push("BR: "+e.message)));
  for(const u of Object.keys(UFN)){
    if(AB[u]&&AB[u].st===0&&D.uf[u])continue;      // estado sem seção apurada: nada a baixar
    if(precisa(u))jobs.push(tse(url(u)).then(j=>{D.uf[u]=achata(j);D.seen[u]=AB[u]?.st??-1;D.t[u]=Date.now();desenha()}).catch(e=>errs.push(u.toUpperCase()+": "+e.message)));
  }
  await Promise.all(jobs);
  LSset("pan-v1",D);desenha();
  $("err").textContent=errs.length?`Falha em ${errs.length} arquivo(s) (${errs[0]}).`:"";
  $("dot").className="dot "+(errs.length&&!D.br?"err":"live");
  t0=Date.now();
}
montaMapa();desenha();
let rodando=false;
async function tick(){if(rodando||document.hidden)return;rodando=true;try{await ciclo()}finally{rodando=false}}
tick();setInterval(tick,REFRESH*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-t0>REFRESH*1000)tick()});
setInterval(()=>{const s=Math.max(0,REFRESH-Math.floor((Date.now()-t0)/1000));$("cd").textContent=`atualização em ${s} s · ${NREQ} req`},1000);
</script>
